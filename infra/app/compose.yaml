name: ens-app

services:
  artifact-server:
    build:
      context: ../../services/artifact-server
    restart: unless-stopped
    environment:
      PORT: "8095"
      ARTIFACT_INTERNAL_KEY: ${ARTIFACT_INTERNAL_KEY:?ARTIFACT_INTERNAL_KEY must be set}
      ARTIFACT_ACCESS_TOKEN_SECRET: ${ARTIFACT_ACCESS_TOKEN_SECRET:?ARTIFACT_ACCESS_TOKEN_SECRET must be set}
      ARTIFACT_DATA_DIR: /app/data
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - app-internal
    volumes:
      - artifact-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8095/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  chat-bridge:
    build:
      context: ../../services/chat-bridge
    restart: unless-stopped
    environment:
      BRIDGE_PORT: "8080"
      BRIDGE_AUTH_MODE: gateway
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-http://hermes:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      ARTIFACT_INTERNAL_URL: http://artifact-server:8095
      ARTIFACT_INTERNAL_KEY: ${ARTIFACT_INTERNAL_KEY:?ARTIFACT_INTERNAL_KEY must be set}
      ARTIFACT_ACCESS_TOKEN_TTL_SECONDS: ${ARTIFACT_ACCESS_TOKEN_TTL_SECONDS:-900}
      BRIDGE_ALLOWED_ORIGINS: "*"
      NODE_ENV: ${NODE_ENV:-production}
      MARKETING_OPS_DELEGATION_ACTIVE_KID: ${MARKETING_OPS_DELEGATION_ACTIVE_KID:-v1}
      MARKETING_OPS_DELEGATION_ACTIVE_KEY: ${MARKETING_OPS_DELEGATION_ACTIVE_KEY:-ens-chat-bridge-mops-delegation-key-32bytes}
      MARKETING_OPS_DELEGATION_REFRESH_KEY: ${MARKETING_OPS_DELEGATION_REFRESH_KEY:-ens-chat-bridge-mops-refresh-key-32bytes}
      PICTURE_INTERNAL_URL: ${PICTURE_INTERNAL_URL:-http://artifact-server:8095}
      PICTURE_INTERNAL_KEY: ${PICTURE_INTERNAL_KEY:-ens-chat-bridge-picture-internal-key-32bytes}
      PICTURE_DELEGATION_ACTIVE_KID: ${PICTURE_DELEGATION_ACTIVE_KID:-p1}
      PICTURE_DELEGATION_ACTIVE_KEY: ${PICTURE_DELEGATION_ACTIVE_KEY:-ens-chat-bridge-picture-delegation-key-32b}
      PICTURE_DELEGATION_REFRESH_KEY: ${PICTURE_DELEGATION_REFRESH_KEY:-ens-chat-bridge-picture-refresh-key-32b}
    networks:
      - app-internal
      - hermes-net
    volumes:
      - bridge-data:/app/data
      - hermes-data:/opt/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app-api:
    build:
      context: ../../services/app-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-nexus}
      PGUSER: ${PGUSER:-nexus_app}
      PGPASSWORD_FILE: /run/secrets/postgres_app_password
      COOKIE_SECRET: ${APP_COOKIE_SECRET:-}
      CHAT_BRIDGE_URL: http://chat-bridge:8080
      ARTIFACT_INTERNAL_URL: http://artifact-server:8095
      ARTIFACT_INTERNAL_KEY: ${ARTIFACT_INTERNAL_KEY:?ARTIFACT_INTERNAL_KEY must be set}
      ARTIFACT_ACCESS_TOKEN_TTL_SECONDS: ${ARTIFACT_ACCESS_TOKEN_TTL_SECONDS:-900}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MARKETING_OPS_INTERNAL_URL: http://marketing-ops:8091
      MARKETING_OPS_BFF_ASSERTION_ACTIVE_KID: ${MARKETING_OPS_BFF_ASSERTION_ACTIVE_KID:-bff-v1}
      MARKETING_OPS_BFF_ASSERTION_ACTIVE_KEY_FILE: /run/secrets/marketing_ops_bff_assertion_key
    networks:
      - app-internal
      - postgres-data
    secrets:
      - postgres_app_password
      - marketing_ops_bff_assertion_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  marketing-ops:
    build:
      context: ../../services/marketing-ops
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MARKETING_OPS_PORT: "8091"
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-nexus}
      PGUSER: ${PGUSER:-nexus_app}
      PGPASSWORD_FILE: /run/secrets/postgres_app_password
      MARKETING_OPS_BFF_ASSERTION_ACTIVE_KID: ${MARKETING_OPS_BFF_ASSERTION_ACTIVE_KID:-bff-v1}
      MARKETING_OPS_BFF_ASSERTION_ACTIVE_KEY_FILE: /run/secrets/marketing_ops_bff_assertion_key
      MARKETING_OPS_INTERNAL_KEY: ${MARKETING_OPS_DELEGATION_REFRESH_KEY:-}
      MARKETING_OPS_DELEGATION_ACTIVE_KID: ${MARKETING_OPS_DELEGATION_ACTIVE_KID:-v1}
      MARKETING_OPS_DELEGATION_ACTIVE_KEY: ${MARKETING_OPS_DELEGATION_ACTIVE_KEY:-}
      MARKETING_OPS_DELEGATION_REFRESH_URL: http://chat-bridge:8080/internal/marketing-ops/delegations/refresh
      MARKETING_OPS_ARTIFACT_URL: http://artifact-server:8095
      MARKETING_OPS_ARTIFACT_INTERNAL_KEY: ${ARTIFACT_INTERNAL_KEY:?ARTIFACT_INTERNAL_KEY must be set}
      MARKETING_OPS_RAG_URL: ${MARKETING_OPS_RAG_URL:-http://rag-mcp:8000/mcp}
      MARKETING_OPS_FEATURE_READ: ${MARKETING_OPS_FEATURE_READ:-false}
      MARKETING_OPS_FEATURE_WRITE: ${MARKETING_OPS_FEATURE_WRITE:-false}
      MARKETING_OPS_FEATURE_APPROVALS: ${MARKETING_OPS_FEATURE_APPROVALS:-false}
      MARKETING_OPS_TENANT_TIME_ZONE: ${MARKETING_OPS_TENANT_TIME_ZONE:-America/Sao_Paulo}
    depends_on:
      artifact-server:
        condition: service_healthy
    networks:
      - app-internal
      - postgres-data
      - hermes-net
    secrets:
      - postgres_app_password
      - marketing_ops_bff_assertion_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8091/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  chat-web:
    build:
      context: ../../apps/chat-web
      args:
        VITE_MARKETING_OPS_ENABLED: ${MARKETING_OPS_FRONTEND_ENABLED:-false}
        VITE_MARKETING_OPS_READ: ${MARKETING_OPS_FRONTEND_READ:-false}
        VITE_MARKETING_OPS_WRITE: ${MARKETING_OPS_FRONTEND_WRITE:-false}
        VITE_MARKETING_OPS_APPROVALS: ${MARKETING_OPS_FRONTEND_APPROVALS:-false}
        VITE_MARKETING_OPS_KILL_SWITCH: ${MARKETING_OPS_FRONTEND_KILL_SWITCH:-false}
    restart: unless-stopped
    depends_on:
      app-api:
        condition: service_healthy
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  artifact-data:
    name: ${ARTIFACT_DATA_VOLUME_NAME:-ens-artifact-data}
  bridge-data:
    name: ${BRIDGE_DATA_VOLUME_NAME:-ens-bridge-data}
  hermes-data:
    name: ${HERMES_DATA_VOLUME_NAME:-ens-hermes-data}

networks:
  app-internal:
    name: ${APP_INTERNAL_NETWORK_NAME:-ens-app-internal}
  postgres-data:
    name: ${POSTGRES_DATA_NETWORK_NAME:-ens-postgres-data}
  hermes-net:
    name: ${HERMES_NETWORK_NAME:-ens-hermes_default}

secrets:
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:-../postgres/secrets/postgres_app_password}
  marketing_ops_bff_assertion_key:
    file: ${MARKETING_OPS_BFF_ASSERTION_KEY_FILE:-./secrets/marketing_ops_bff_assertion_key}
