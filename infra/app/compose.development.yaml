services:
  artifact-server:
    environment:
      NODE_ENV: development
    ports:
      - "${ARTIFACT_PORT:-8095}:8095"

  chat-bridge:
    environment:
      NODE_ENV: development
      BRIDGE_ALLOW_INSECURE_LOCAL_AUTH: "true"
    ports:
      - "${BRIDGE_PORT:-8082}:8080"

  app-api:
    environment:
      NODE_ENV: development
    ports:
      - "${APP_API_PORT:-3000}:3000"

  marketing-ops:
    environment:
      NODE_ENV: development
      MARKETING_OPS_FEATURE_READ: "true"
      MARKETING_OPS_FEATURE_WRITE: "true"
      MARKETING_OPS_FEATURE_APPROVALS: "true"
      MARKETING_OPS_STRUCTURED_PLAN_EXECUTION: "true"
    ports:
      - "${MARKETING_OPS_PORT:-8091}:8091"

  chat-web:
    build:
      args:
        VITE_MARKETING_OPS_ENABLED: "true"
        VITE_MARKETING_OPS_READ: "true"
        VITE_MARKETING_OPS_WRITE: "true"
        VITE_MARKETING_OPS_APPROVALS: "true"
        VITE_MARKETING_OPS_STRUCTURED_PLAN_EXECUTION: "true"
        VITE_MARKETING_OPS_KILL_SWITCH: "false"
    ports:
      - "${CHAT_WEB_PORT:-8088}:8080"
