name: ens-hermes

x-hermes-image: &hermes-image
  image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79

x-hermes-environment: &hermes-environment
  HERMES_HOME: /opt/data
  HERMES_PROFILE_NAME: ${HERMES_PROFILE_NAME:-ens}
  NEXUS_MARKETING_OPS_MCP_URL: ${NEXUS_MARKETING_OPS_MCP_URL:-http://marketing-ops:3001/mcp}

services:
  hermes-profile-init:
    <<: *hermes-image
    restart: "no"
    entrypoint:
      - /bin/sh
      - /profile-init.sh
    environment:
      <<: *hermes-environment
    volumes:
      - hermes-data:/opt/data
      - ../../agents/ens:/distribution:ro
      - ./profile-init.sh:/profile-init.sh:ro

  hermes:
    <<: *hermes-image
    command:
      - hermes
      - -p
      - ${HERMES_PROFILE_NAME:-ens}
      - gateway
      - run
      - --no-supervise
    restart: unless-stopped
    depends_on:
      hermes-profile-init:
        condition: service_completed_successfully
    environment:
      <<: *hermes-environment
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be configured}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_OAUTH_CLIENT_ID: ${HERMES_DASHBOARD_OAUTH_CLIENT_ID:-}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.solucoes-nexus.tech}
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  hermes-data:
    name: ${HERMES_DATA_VOLUME_NAME:-ens-hermes-data}
