openapi: 3.1.0
info:
  title: Nexus Marketing Ops API
  version: 1.0.0
  description: REST contract for the operational campaign workspace.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /ads-integrations/{provider}/setup:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: '#/components/schemas/AdsProvider' }
    get:
      operationId: readAdsSetup
      summary: Read safe installation application metadata
      description: Administrator only, verified against the canonical application identity. Never returns credentials or tokens.
      responses:
        '200':
          description: Safe setup state; prepared does not mean authorized.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: '#/components/schemas/AdsSetup' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: saveAdsSetup
      summary: Configure or replace the installation application
      description: Administrator only. Secrets are stored privately on the server. Replacement requires explicit confirmation and invalidates prior authorizations while preserving history. Empty secret preserves an existing managed secret; initial setup and external takeover require a new secret. Callback origin comes exclusively from trusted server configuration.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdsSetupInput' }
      responses:
        '200':
          description: Safe metadata for the published configuration.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: '#/components/schemas/AdsSetup' } } }
        default: { $ref: '#/components/responses/Error' }
  /ads-integrations: {"get":{"operationId":"listAdsIntegrations","summary":"Read safe connection states","parameters":[],"responses":{"200":{"description":"Read safe connection states","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/AdsConnection"}}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/authorize: {"post":{"operationId":"authorizeAds","summary":"Manage the installation's Ads authorization","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}},{"name":"X-ENS-OAuth-Session","in":"header","required":true,"description":"BFF-derived HMAC of authenticated session, never a browser-supplied identity.","schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsEmpty"}}}},"responses":{"200":{"description":"Manage the installation's Ads authorization","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsAuthorization"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/callback: {"post":{"operationId":"completeAdsAuthorization","summary":"Manage the installation's Ads authorization","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}},{"name":"X-ENS-OAuth-Session","in":"header","required":true,"description":"BFF-derived HMAC of authenticated session, never a browser-supplied identity.","schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsCallback"}}}},"responses":{"200":{"description":"Manage the installation's Ads authorization","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsConnection"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/account: {"post":{"operationId":"selectAdsAccount","summary":"Manage the installation's Ads authorization","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}},{"$ref":"#/components/parameters/IfMatch"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsAccountInput"}}}},"responses":{"200":{"description":"Manage the installation's Ads authorization","headers":{"ETag":{"$ref":"#/components/headers/ETag"}},"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsConnection"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/disconnect: {"post":{"operationId":"disconnectAds","summary":"Manage the installation's Ads authorization","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}},{"$ref":"#/components/parameters/IfMatch"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsEmpty"}}}},"responses":{"200":{"description":"Manage the installation's Ads authorization","headers":{"ETag":{"$ref":"#/components/headers/ETag"}},"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsConnection"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/accounts: {"get":{"operationId":"listAdsAccounts","summary":"Read accessible advertising accounts","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}}],"responses":{"200":{"description":"Read accessible advertising accounts","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/AdsAccount"}}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /ads-integrations/{provider}/campaigns: {"get":{"operationId":"listExternalAdsCampaigns","summary":"Read campaigns from the selected advertising account","parameters":[{"name":"provider","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AdsProvider"}}],"responses":{"200":{"description":"Read campaigns from the selected advertising account","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/AdsExternalCampaign"}}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /campaigns/{id}/ads-links: {"get":{"operationId":"listAdsLinks","summary":"Read authorized campaign links","parameters":[{"$ref":"#/components/parameters/Id"}],"responses":{"200":{"description":"Read authorized campaign links","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/AdsLink"}}}}}}},"default":{"$ref":"#/components/responses/Error"}}},"post":{"operationId":"createAdsLink","summary":"Confirm advertisement attribution","parameters":[{"$ref":"#/components/parameters/Id"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsLinkInput"}}}},"responses":{"201":{"description":"Confirm advertisement attribution","headers":{"ETag":{"$ref":"#/components/headers/ETag"}},"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsLink"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /campaigns/{id}/ads-links/{linkId}/disable: {"post":{"operationId":"disableAdsLink","summary":"Stop further synchronization and preserve history","parameters":[{"$ref":"#/components/parameters/Id"},{"name":"linkId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IfMatch"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsEmpty"}}}},"responses":{"200":{"description":"Stop further synchronization and preserve history","headers":{"ETag":{"$ref":"#/components/headers/ETag"}},"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsLink"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /campaigns/{id}/ads-links/{linkId}/sync: {"post":{"operationId":"syncAdsLink","summary":"Read provider data with reviewed native contact batches","parameters":[{"$ref":"#/components/parameters/Id"},{"name":"linkId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdsPeriod"}}}},"responses":{"200":{"description":"Read provider data with reviewed native contact batches","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsSyncReceipt"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /campaigns/{id}/ads-links/{linkId}/results: {"get":{"operationId":"readAdsResults","summary":"Read provider measurements and durable receipts","parameters":[{"$ref":"#/components/parameters/Id"},{"name":"linkId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Read provider measurements and durable receipts","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/AdsResults"}}}}}},"default":{"$ref":"#/components/responses/Error"}}}}
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Read service capabilities
      security: []
      responses:
        '200':
          description: Current contract and feature flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List authorized campaigns
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CampaignStatus' } }
        - { name: referenceType, in: query, schema: { $ref: '#/components/schemas/ReferenceType' } }
        - { name: referenceKey, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/CampaignChannel' } }
        - { name: responsible, in: query, schema: { type: string, format: uuid } }
        - { name: periodFrom, in: query, schema: { type: string, format: date } }
        - { name: periodTo, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: course, in: query, deprecated: true, schema: { $ref: '#/components/schemas/CourseSlug' } }
        - { name: owner, in: query, deprecated: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, deprecated: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, deprecated: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Authorized campaigns and cursor page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createCampaign
      summary: Create a campaign draft
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignCreate' }
      responses:
        '201':
          description: Draft created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Read a campaign workspace
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Campaign detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCampaign
      summary: Update campaign fields
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignPatch' }
      responses:
        '200':
          description: Campaign updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{id}/transitions:
    post:
      operationId: transitionCampaign
      summary: Change campaign status
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignTransition' }
      responses:
        '200':
          description: Campaign status changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{id}/archive:
    post:
      operationId: archiveCampaign
      summary: Archive a campaign
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Campaign archived
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/participants:
    get:
      operationId: listCampaignParticipants
      summary: List campaign participants
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
      responses:
        '200':
          description: Campaign participants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantListEnvelope' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addCampaignParticipant
      summary: Add a campaign participant
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantCreate' }
      responses:
        '201':
          description: Participant added
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantMutationEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/participant-candidates:
    get:
      operationId: listCampaignParticipantCandidates
      summary: List eligible participant candidates
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: q, in: query, schema: { type: string, maxLength: 100, default: '' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Active tenant candidates with safe profile fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantCandidateListEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/participants/{userId}:
    patch:
      operationId: updateCampaignParticipant
      summary: Update a campaign participant
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantPatch' }
      responses:
        '200':
          description: Participant updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantMutationEnvelope' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeCampaignParticipant
      summary: Remove a campaign participant
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Participant removed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantRemovalEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/materials:
    get:
      operationId: listCampaignMaterials
      summary: List campaign materials
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
      responses:
        '200':
          description: Linked campaign materials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialListEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/materials/upload:
    post:
      operationId: uploadCampaignMaterial
      summary: Upload and link campaign material
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/Filename' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary, maxLength: 26214400 }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary, maxLength: 26214400 }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary, maxLength: 26214400 }
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema: { type: string, format: binary, maxLength: 26214400 }
          text/plain:
            schema: { type: string, format: binary, maxLength: 26214400 }
          text/csv:
            schema: { type: string, format: binary, maxLength: 26214400 }
          image/png:
            schema: { type: string, format: binary, maxLength: 26214400 }
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 26214400 }
          image/webp:
            schema: { type: string, format: binary, maxLength: 26214400 }
      responses:
        '201':
          description: Material uploaded and linked
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialMutationEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/materials/link:
    post:
      operationId: linkCampaignMaterial
      summary: Link an existing artifact
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialLink' }
      responses:
        '201':
          description: Existing artifact linked
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialMutationEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/materials/{materialId}:
    delete:
      operationId: unlinkCampaignMaterial
      summary: Unlink campaign material
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/MaterialId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Material link removed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialRemovalEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/materials/{materialId}/access-link:
    post:
      operationId: createCampaignMaterialAccessLink
      summary: Create a short-lived material link
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/MaterialId' }
      responses:
        '200':
          description: Short-lived authorized access link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialAccessEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaigns/{campaignId}/timeline:
    get:
      operationId: listCampaignTimeline
      summary: List safe campaign activity
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Safe campaign activity projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
        default: { $ref: '#/components/responses/Error' }
  /references/courses:
    get:
      operationId: searchCourseReferences
      summary: Search official course references
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
      responses:
        '200':
          description: Reduced official course references from the read-only RAG MCP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseReferenceListEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaign-items:
    get:
      operationId: listProductionSchedule
      summary: List the canonical production schedule
      parameters:
        - name: view
          in: query
          description: Allowlisted presentation view used only for operational metrics
          schema:
            type: string
            enum: [list, week, month]
            default: list
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: campaignId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ItemKind' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/CampaignChannel' } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ItemStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/ItemPriority' } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Authorized items from the canonical query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionSchedulePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProductionItem
      summary: Create a production item
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionItemCreate' }
      responses:
        '201':
          description: Production item created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionItemEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaign-items/batch:
    post:
      operationId: executeProductionItemBatch
      summary: Apply one reversible action to versioned production items
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBatchInput' }
      responses:
        '200':
          description: Explicit deterministic result for every requested item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBatchEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /campaign-items/{itemId}:
    get:
      operationId: getProductionItem
      summary: Read a production item
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: Production item detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionItemEnvelope' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProductionItem
      summary: Update production item fields
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionItemPatch' }
