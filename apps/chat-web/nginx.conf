worker_processes  1;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Authorization callbacks carry secrets in their query string.
  log_format safe_request '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout safe_request;

  sendfile        on;
  keepalive_timeout  65;

  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  client_max_body_size 50M;

  server {
    listen 8080;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Optional, operator-controlled trust for the production ingress proxy.
    # No forwarded client header is trusted by default.
    include /etc/nginx/trusted-proxies/*.conf;

    location ~ ^/api/ads/oauth/(meta|google|linkedin)/callback$ {
      # nginx error logs include the original URI on upstream errors. The BFF
      # records sanitized outcomes; never log callback query strings here.
      access_log off;
      error_log /dev/null;
      set $app_api_upstream http://app-api:3000;
      proxy_pass $app_api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Leave headroom above the BFF's 120s Google authorization budget.
      proxy_read_timeout 130s;
    }

    location /api/ {
      set $app_api_upstream http://app-api:3000;
      proxy_pass $app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE streaming support (disables proxy buffering)
      proxy_buffering off;
      proxy_read_timeout 86400s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
